<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - شحن الرصيد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #007bff; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h2>شحن رصيد الحساب</h2>
        
        <div class="form-group">
            <label for="accountNumber">رقم الحساب:</label>
            <input type="text" id="accountNumber" placeholder="مثال: 0758525">
        </div>

        <div class="form-group">
            <label for="amount">المبلغ المراد شحنه:</label>
            <input type="number" id="amount" placeholder="أدخل المبلغ هنا">
        </div>

        <button id="rechargeBtn" onclick="rechargeBalance()">شحن الرصيد</button>
        
        <div id="message"></div>
    </div>

    <!-- استدعاء مكتبة Firebase (النسخة 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ==========================================
        // 1. إعدادات Firebase (ضع بيانات مشروعك هنا)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==========================================
        // 2. دالة الشحن الرئيسية
        // ==========================================
        async function rechargeBalance() {
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const btn = document.getElementById('rechargeBtn');
            const messageDiv = document.getElementById('message');

            // تصفير الرسائل السابقة
            messageDiv.innerHTML = '';
            messageDiv.className = '';

            // التحقق من المدخلات
            if (!accountNumber) {
                showMessage('الرجاء إدخال رقم الحساب.', 'error');
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showMessage('الرجاء إدخال مبلغ صحيح أكبر من الصفر.', 'error');
                return;
            }

            // تعطيل الزر لمنع الضغط المتكرر
            btn.disabled = true;
            showMessage('جاري البحث عن الحساب...', 'loading');

            try {
                // البحث في قاعدة البيانات عن رقم الحساب
                // ملاحظة: نفترض أن البيانات مخزنة مباشرة في الجذر. 
                // إذا كانت داخل مجلد اسمه users، غير السطر إلى: db.ref('users')
                const snapshot = await db.ref('/').orderByChild('رقم الحساب').equalTo(accountNumber).once('value');

                if (!snapshot.exists()) {
                    showMessage('عذراً، لم يتم العثور على حساب بهذا الرقم.', 'error');
                    btn.disabled = false;
                    return;
                }

                // استخراج بيانات المستخدم
                let userId = null;
                let currentBalance = 0;

                snapshot.forEach((childSnapshot) => {
                    userId = childSnapshot.key; // المعرف الفريد (مثل rFFGhucc...)
                    const userData = childSnapshot.val();
                    // قراءة الرصيد الحالي، إذا لم يكن موجوداً نعتبره 0
                    currentBalance = parseFloat(userData['توازن']) || 0; 
                });

                // حساب الرصيد الجديد
                const newBalance = currentBalance + amount;

                showMessage('جاري تحديث الرصيد في السيرفر...', 'loading');

                // تحديث حقل "توازن" فقط في قاعدة البيانات
                await db.ref('/' + userId).update({
                    'توازن': newBalance
                });

                // نجاح العملية
                showMessage(`تم الشحن بنجاح! الرصيد الجديد للحساب (${accountNumber}) هو: ${newBalance}`, 'success');
                
                // تفريغ الحقول
                document.getElementById('accountNumber').value = '';
                document.getElementById('amount').value = '';

            } catch (error) {
                console.error("خطأ في Firebase:", error);
                showMessage('حدث خطأ أثناء الاتصال بالسيرفر. تأكد من الصلاحيات (Rules).', 'error');
            } finally {
                // إعادة تفعيل الزر
                btn.disabled = false;
            }
        }

        // دالة مساعدة لإظهار الرسائل
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerText = text;
            messageDiv.className = type;
        }
    </script>
</body>
</html>
